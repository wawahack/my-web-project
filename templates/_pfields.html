<div class="fgrid">
  <label>ชื่อสินค้า<input name="name" value="{{ p.name }}" required></label>
  <label>ราคา (บาท)<input name="price" type="number" min="1" value="{{ p.price }}" required></label>
  <label>ราคาเดิม (ถ้าลดราคา)<input name="was" type="number" min="0" value="{{ p.was if p.was else '' }}"></label>
  <label>จำกัดจำนวน (ว่าง = ไม่จำกัด)<input name="stock" type="number" min="0" value="{{ p.stock if p.stock is not none else '' }}"></label>
  <label>ป้ายบนปก<input name="tag" maxlength="30" value="{{ p.tag }}"></label>
  <label>หมวด / ภาษา (พิมพ์เอง ขึ้นเป็นตัวใหญ่บนปก)<input name="cat" maxlength="20" list="catlist" value="{{ p.cat }}" placeholder="เช่น PYTHON, JS, C++, BOT" required></label>
  <label class="chk"><input type="checkbox" name="active" {{ 'checked' if p.active }}> แสดงหน้าร้าน</label>
</div>
<label>คำอธิบาย<textarea name="description" rows="3">{{ p.description }}</textarea></label>
<label>โค้ดตัวอย่างโชว์หน้าร้าน (ไม่บังคับ ใส่ส่วนสั้นๆ พอ)<textarea name="preview" rows="4">{{ p.preview }}</textarea></label>
<label>เพิ่มไฟล์ที่ลูกค้าจะได้ (เลือกได้หลายไฟล์ ทุกนามสกุล)<input type="file" name="files" multiple></label>
