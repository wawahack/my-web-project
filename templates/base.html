<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ shop }}{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&family=Kanit:ital,wght@0,400;0,600;1,800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="bar"><div class="wrap"><a class="logo" href="/"><i aria-hidden="true"></i>{{ brand() }}</a>{% block nav %}{% endblock %}</div></div>
<main class="wrap page">
{% for m in get_flashed_messages() %}<p class="flash" role="status">{{ m }}</p>{% endfor %}
{% block body %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
